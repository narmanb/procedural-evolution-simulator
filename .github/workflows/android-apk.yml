name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: procedural-evolution-simulator-debug

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Parse project and scripts
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          test -s "build/android/${EXPORT_NAME}.apk"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: procedural-evolution-simulator-apk
          path: build/android/procedural-evolution-simulator-debug.apk
          if-no-files-found: error
          retention-days: 30
